name: Build and deploy Hetzner admin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pv-market-hetzner-admin
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/info-pvmarket/pv-market-adminpanel

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build test image
        run: docker build --target test --tag pv-market-admin:test .

      - name: Run tests
        run: |
          docker run --rm \
            --env APP_ENV=testing \
            --env APP_KEY=base64:3gzFHPE65dM4BUih5pmzrP5ZMue/MGnmoWI8FdB8Oo8= \
            pv-market-admin:test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure Hetzner SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy development then production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_SSH_USER }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          deploy() {
            local environment="$1"
            printf '%s\n' "$GHCR_TOKEN" |
              ssh -i "$HOME/.ssh/id_ed25519" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o ServerAliveInterval=30 \
                -o ServerAliveCountMax=12 \
                "$DEPLOY_USER@$DEPLOY_HOST" \
                "sudo /usr/local/sbin/pv-market-new-deploy '$environment' admin '$IMAGE_NAME@$IMAGE_DIGEST' '$GHCR_USER'"
          }
          deploy dev
          deploy prod
